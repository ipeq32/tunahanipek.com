name: Blog CI

on:
  push:
    paths:
      - 'blog/**'
      - 'docker-compose.yml'
      - '.github/workflows/blog-ci.yml'
  pull_request:
    paths:
      - 'blog/**'
      - 'docker-compose.yml'
      - '.github/workflows/blog-ci.yml'

defaults:
  run:
    working-directory: blog

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: blog/.nvmrc
          cache: yarn
          cache-dependency-path: blog/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
        env:
          NEXTAUTH_SECRET: ci-build-secret-min-32-chars-long
          NEXTAUTH_URL: http://localhost:3000
          POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci
          POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_API_URL: http://localhost:3000

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXTAUTH_SECRET: ci-build-secret-min-32-chars-long
      NEXTAUTH_URL: http://localhost:3000
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: blog/.nvmrc
          cache: yarn
          cache-dependency-path: blog/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare database
        run: yarn generate-local

      - name: Build
        run: yarn build

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Run e2e tests
        run: yarn test:e2e
