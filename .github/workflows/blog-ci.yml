name: Blog CI

on:
  push:
    paths:
      - 'blog/**'
      - '.github/workflows/blog-ci.yml'
  pull_request:
    paths:
      - 'blog/**'
      - '.github/workflows/blog-ci.yml'

defaults:
  run:
    working-directory: blog

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: blog/.nvmrc
          cache: yarn
          cache-dependency-path: blog/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
        env:
          NEXTAUTH_SECRET: ci-build-secret-min-32-chars-long
          NEXTAUTH_URL: http://localhost:3000
          POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci
          POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_API_URL: http://localhost:3000
